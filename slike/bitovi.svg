<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 322" role="img" aria-label="Raspored bitova u mjerilu: FP32 ima 1 bit znaka, 8 eksponenta i 23 mantise; BF16 1, 8 i 7; FP16 1, 5 i 10; FP8 E4M3 1, 4 i 3; FP8 E5M2 1, 5 i 2.">
  <!-- u mjerilu: 16 jedinica = 1 bit, početak x = 112 -->

  <!-- ravnalo -->
  <g fill="none" stroke="var(--fig-line)" stroke-width="1"><path d="M112 24H624M112 18v6M240 18v6M368 18v6M496 18v6M624 18v6"/></g>
  <g font-family="Barlow, Arial, sans-serif" font-size="12" fill="var(--fig-muted)" text-anchor="middle">
    <text x="112" y="13">0</text><text x="240" y="13">8</text><text x="368" y="13">16</text><text x="496" y="13">24</text><text x="624" y="13">32 bita</text>
  </g>

  <!-- FP32 -->
  <rect x="112" y="45" width="16" height="26" fill="var(--fig-c-soft)" stroke="var(--fig-c)" stroke-width="1.2"/>
  <rect x="128" y="45" width="128" height="26" fill="var(--fig-a-soft)" stroke="var(--fig-a)" stroke-width="1.2"/>
  <rect x="256" y="45" width="368" height="26" fill="var(--fig-b-soft)" stroke="var(--fig-b)" stroke-width="1.2"/>
  <path d="M144 45v26m16-26v26m16-26v26m16-26v26m16-26v26m16-26v26m16-26v26M272 45v26m16-26v26m16-26v26m16-26v26m16-26v26m16-26v26m16-26v26m16-26v26m16-26v26m16-26v26m16-26v26m16-26v26m16-26v26m16-26v26m16-26v26m16-26v26m16-26v26m16-26v26m16-26v26m16-26v26m16-26v26m16-26v26" fill="none" stroke="var(--fig-line)" stroke-width=".6"/>

  <!-- BF16 -->
  <rect x="112" y="99" width="16" height="26" fill="var(--fig-c-soft)" stroke="var(--fig-c)" stroke-width="1.2"/>
  <rect x="128" y="99" width="128" height="26" fill="var(--fig-a-soft)" stroke="var(--fig-a)" stroke-width="1.2"/>
  <rect x="256" y="99" width="112" height="26" fill="var(--fig-b-soft)" stroke="var(--fig-b)" stroke-width="1.2"/>
  <path d="M144 99v26m16-26v26m16-26v26m16-26v26m16-26v26m16-26v26m16-26v26M272 99v26m16-26v26m16-26v26m16-26v26m16-26v26m16-26v26" fill="none" stroke="var(--fig-line)" stroke-width=".6"/>

  <!-- FP16 -->
  <rect x="112" y="153" width="16" height="26" fill="var(--fig-c-soft)" stroke="var(--fig-c)" stroke-width="1.2"/>
  <rect x="128" y="153" width="80" height="26" fill="var(--fig-a-soft)" stroke="var(--fig-a)" stroke-width="1.2"/>
  <rect x="208" y="153" width="160" height="26" fill="var(--fig-b-soft)" stroke="var(--fig-b)" stroke-width="1.2"/>
  <path d="M144 153v26m16-26v26m16-26v26m16-26v26M224 153v26m16-26v26m16-26v26m16-26v26m16-26v26m16-26v26m16-26v26m16-26v26m16-26v26" fill="none" stroke="var(--fig-line)" stroke-width=".6"/>

  <!-- FP8 E4M3 -->
  <rect x="112" y="207" width="16" height="26" fill="var(--fig-c-soft)" stroke="var(--fig-c)" stroke-width="1.2"/>
  <rect x="128" y="207" width="64" height="26" fill="var(--fig-a-soft)" stroke="var(--fig-a)" stroke-width="1.2"/>
  <rect x="192" y="207" width="48" height="26" fill="var(--fig-b-soft)" stroke="var(--fig-b)" stroke-width="1.2"/>
  <path d="M144 207v26m16-26v26m16-26v26M208 207v26m16-26v26" fill="none" stroke="var(--fig-line)" stroke-width=".6"/>

  <!-- FP8 E5M2 -->
  <rect x="112" y="261" width="16" height="26" fill="var(--fig-c-soft)" stroke="var(--fig-c)" stroke-width="1.2"/>
  <rect x="128" y="261" width="80" height="26" fill="var(--fig-a-soft)" stroke="var(--fig-a)" stroke-width="1.2"/>
  <rect x="208" y="261" width="32" height="26" fill="var(--fig-b-soft)" stroke="var(--fig-b)" stroke-width="1.2"/>
  <path d="M144 261v26m16-26v26m16-26v26m16-26v26M224 261v26" fill="none" stroke="var(--fig-line)" stroke-width=".6"/>

  <!-- brojevi bitova -->
  <g font-family="Barlow, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">
    <g fill="var(--fig-c)"><text x="120" y="41">1</text><text x="120" y="95">1</text><text x="120" y="149">1</text><text x="120" y="203">1</text><text x="120" y="257">1</text></g>
    <g fill="var(--fig-a)"><text x="192" y="41">8</text><text x="192" y="95">8</text><text x="168" y="149">5</text><text x="160" y="203">4</text><text x="168" y="257">5</text></g>
    <g fill="var(--fig-b)"><text x="440" y="41">23</text><text x="312" y="95">7</text><text x="288" y="149">10</text><text x="216" y="203">3</text><text x="224" y="257">2</text></g>
  </g>

  <!-- nazivi -->
  <g font-family="Barlow Condensed, Arial Narrow, Arial, sans-serif" font-size="17" font-weight="700" fill="var(--fig-ink)">
    <text x="1" y="56">FP32</text><text x="1" y="110">BF16</text><text x="1" y="164">FP16</text><text x="1" y="218">FP8 E4M3</text><text x="1" y="272">FP8 E5M2</text>
  </g>
  <g font-family="Barlow, Arial, sans-serif" font-size="12" fill="var(--fig-muted)">
    <text x="1" y="71">4 bajta</text><text x="1" y="125">2 bajta</text><text x="1" y="179">2 bajta</text><text x="1" y="233">1 bajt</text><text x="1" y="287">1 bajt</text>
  </g>

  <!-- napomene -->
  <g font-family="Barlow, Arial, sans-serif" font-size="13" fill="var(--fig-ink)">
    <text x="380" y="116">raspon kao FP32, oko 8 značajnih bitova</text>
    <text x="380" y="170">više preciznosti, manji raspon od BF16</text>
    <text x="252" y="224">manji raspon, više preciznosti</text>
    <text x="252" y="278">veći raspon, manje preciznosti</text>
  </g>

  <!-- legenda -->
  <rect x="112" y="303" width="12" height="12" fill="var(--fig-c-soft)" stroke="var(--fig-c)" stroke-width="1.2"/>
  <rect x="172" y="303" width="12" height="12" fill="var(--fig-a-soft)" stroke="var(--fig-a)" stroke-width="1.2"/>
  <rect x="268" y="303" width="12" height="12" fill="var(--fig-b-soft)" stroke="var(--fig-b)" stroke-width="1.2"/>
  <g font-family="Barlow, Arial, sans-serif" font-size="12.5" fill="var(--fig-ink)">
    <text x="129" y="314">znak</text><text x="189" y="314">eksponent</text><text x="285" y="314">mantisa</text>
    <text x="624" y="314" text-anchor="end" fill="var(--fig-muted)">u mjerilu: svaka ćelija je jedan bit</text>
  </g>
</svg>
