<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 308" role="img" aria-label="Cjelovit cjevovod u dvanaest koraka: cilj, izbor modela, prompt i RAG, podaci, trening LoRA, spajanje, GGUF, kvantizacija, mjerenje, sigurnost, posluživanje i pogon. Ako je rezultat ispod cilja, vraćaš se na trening.">
