<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" role="img" aria-label="Looped model Dory1.0-4B: 8 ulaznih blokova, zatim 20 ponavljajućih blokova N puta i 8 izlaznih. Ulaz se ponovno ubacuje u svaku petlju, a broj petlji mijenja se pri izvođenju.">
  <defs><marker id="looped-str" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 .8 7.5 4 0 7.2z" fill="var(--fig-muted)"/></marker>
  <marker id="looped-nar" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 .8 7.5 4 0 7.2z" fill="var(--fig-b)"/></marker></defs>

  <text x="1" y="18" font-family="Barlow Condensed, Arial Narrow, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--fig-ink)">Dory1.0-4B: 8 + 20 × N + 8 blokova, zadano N = 2</text>

  <!-- zagrada iznad petlji -->
  <path d="M130 50V42H490V50" fill="none" stroke="var(--fig-b)" stroke-width="1.2"/>
  <text x="310" y="36" text-anchor="middle" font-family="Barlow, Arial, sans-serif" font-size="12.5" font-weight="600" fill="var(--fig-b)">istih 20 blokova prolazi se N puta</text>

  <!-- blokovi: 8 jedinica = 1 blok -->
  <rect x="30" y="86" width="64" height="40" fill="var(--fig-a-soft)" stroke="var(--fig-a)" stroke-width="1.3"/>
  <path d="M38 86v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40" fill="none" stroke="var(--fig-a)" stroke-width=".7"/>

  <rect x="130" y="86" width="160" height="40" fill="var(--fig-b-soft)" stroke="var(--fig-b)" stroke-width="1.3"/>
  <path d="M138 86v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40" fill="none" stroke="var(--fig-b)" stroke-width=".7"/>

  <rect x="330" y="86" width="160" height="40" fill="var(--fig-b-soft)" stroke="var(--fig-b)" stroke-width="1.3"/>
  <path d="M338 86v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40" fill="none" stroke="var(--fig-b)" stroke-width=".7"/>

  <rect x="532" y="86" width="64" height="40" fill="var(--fig-c-soft)" stroke="var(--fig-c)" stroke-width="1.3"/>
  <path d="M540 86v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40m8-40v40" fill="none" stroke="var(--fig-c)" stroke-width=".7"/>

  <rect x="620" y="90" width="59" height="32" fill="var(--fig-soft)" stroke="var(--fig-line)" stroke-width="1.2"/>

  <!-- tok -->
  <g fill="none" stroke="var(--fig-muted)" stroke-width="1.2" marker-end="url(#looped-str)">
    <path d="M15 72V106H29"/><path d="M94 106H104"/><path d="M119 106H129"/><path d="M290 106H300"/><path d="M315 106H329"/><path d="M490 106H500"/><path d="M515 106H531"/><path d="M596 106H619"/>
  </g>

  <!-- ponovno ubacivanje -->
  <path d="M62 126V158H507" fill="none" stroke="var(--fig-b)" stroke-width="1.4"/>
  <path d="M112 158V114" fill="none" stroke="var(--fig-b)" stroke-width="1.4" marker-end="url(#looped-nar)"/>
  <path d="M308 158V114" fill="none" stroke="var(--fig-b)" stroke-width="1.4" marker-end="url(#looped-nar)"/>
  <path d="M507 158V114" fill="none" stroke="var(--fig-b)" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#looped-nar)"/>

  <g fill="var(--fig-bg)" stroke="var(--fig-b)" stroke-width="1.3"><circle cx="112" cy="106" r="7"/><circle cx="308" cy="106" r="7"/><circle cx="507" cy="106" r="7"/></g>
  <path d="M108 106h8M112 102v8M304 106h8M308 102v8M503 106h8M507 102v8" fill="none" stroke="var(--fig-b)" stroke-width="1.3"/>

  <g font-family="Barlow, Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="var(--fig-ink)">
    <text x="62" y="62" font-weight="600">ulaz</text><text x="62" y="78" fill="var(--fig-muted)">8 blokova</text>
    <text x="210" y="62" font-weight="600">petlja 1</text><text x="210" y="78" fill="var(--fig-muted)">20 blokova</text>
    <text x="410" y="62" font-weight="600">petlja 2</text><text x="410" y="78" fill="var(--fig-muted)">20 blokova</text>
    <text x="507" y="82" font-weight="600">...</text>
    <text x="564" y="62" font-weight="600">izlaz</text><text x="564" y="78" fill="var(--fig-muted)">8 blokova</text>
    <text x="649.5" y="111" font-size="13" font-weight="600">logiti</text>
    <text x="284" y="175" fill="var(--fig-b)" font-weight="600">ulaz se ponovno ubacuje u svaku petlju</text>
  </g>
  <text x="1" y="64" font-family="Barlow, Arial, sans-serif" font-size="12.5" fill="var(--fig-muted)">tokeni</text>

  <g font-family="Barlow, Arial, sans-serif" font-size="13" fill="var(--fig-ink)">
    <text x="1" y="208">N se mijenja pri izvođenju, bez ponovnog treniranja.</text>
    <text x="1" y="227">Last-loop KV cache drži KV memoriju ravnom. Kontekst do 256K, prednaučen u NVFP4.</text>
    <text x="1" y="246">Istraživački prethodnik (arXiv 2311.12424): petlje nakon trenirane granice brzo divergiraju.</text>
  </g>
  <text x="1" y="274" font-family="Barlow, Arial, sans-serif" font-size="12.5" fill="var(--fig-muted)">Širine blokova su u mjerilu: svaka ćelija je jedan blok. Model: nvidia/NVIDIA-Nemotron-Labs-Dory1.0-4B-BF16.</text>
</svg>
