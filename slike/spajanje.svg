<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 366" role="img" aria-label="Dva načina spajanja modela. Passthrough prepisuje svaki tenzor iz jednog modela bez računanja. TIES i DARE računaju razliku od baze, nasumično izbacuju dio, biraju većinski predznak i dodaju rezultat bazi.">
  <defs><marker id="spajanje-str" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 .8 7.5 4 0 7.2z" fill="var(--fig-muted)"/></marker></defs>

  <!-- passthrough -->
  <rect x="1" y="1" width="678" height="132" fill="var(--fig-soft)" stroke="var(--fig-line)" stroke-width="1"/>
  <text x="13" y="22" font-family="Barlow Condensed, Arial Narrow, Arial, sans-serif" font-size="17" font-weight="700" fill="var(--fig-a)"><tspan font-family="JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none" font-size="14" font-weight="600">passthrough</tspan>: svaki se tenzor prepisuje iz jednog modela, bez računanja</text>

  <!-- A -->
  <rect x="92" y="32" width="110" height="26" fill="var(--fig-a-soft)" stroke="var(--fig-a)" stroke-width="1.2"/>
  <rect x="202" y="32" width="170" height="26" fill="var(--fig-a-soft)" stroke="var(--fig-a)" stroke-width="1.2"/>
  <rect x="372" y="32" width="170" height="26" fill="var(--fig-bg)" stroke="var(--fig-line)" stroke-width="1"/>
  <rect x="542" y="32" width="110" height="26" fill="var(--fig-a-soft)" stroke="var(--fig-a)" stroke-width="1.2"/>
  <!-- B -->
  <rect x="92" y="62" width="110" height="26" fill="var(--fig-bg)" stroke="var(--fig-line)" stroke-width="1"/>
  <rect x="202" y="62" width="170" height="26" fill="var(--fig-bg)" stroke="var(--fig-line)" stroke-width="1"/>
  <rect x="372" y="62" width="170" height="26" fill="var(--fig-b-soft)" stroke="var(--fig-b)" stroke-width="1.2"/>
  <rect x="542" y="62" width="110" height="26" fill="var(--fig-bg)" stroke="var(--fig-line)" stroke-width="1"/>
  <!-- izlaz -->
  <rect x="92" y="98" width="110" height="26" fill="var(--fig-a-soft)" stroke="var(--fig-a)" stroke-width="1.6"/>
  <rect x="202" y="98" width="170" height="26" fill="var(--fig-a-soft)" stroke="var(--fig-a)" stroke-width="1.6"/>
  <rect x="372" y="98" width="170" height="26" fill="var(--fig-b-soft)" stroke="var(--fig-b)" stroke-width="1.6"/>
  <rect x="542" y="98" width="110" height="26" fill="var(--fig-a-soft)" stroke="var(--fig-a)" stroke-width="1.6"/>

  <g font-family="Barlow, Arial, sans-serif" font-size="13" fill="var(--fig-ink)" font-weight="600">
    <text x="13" y="50">Model A</text><text x="13" y="80">Model B</text><text x="13" y="116">Izlaz</text>
  </g>
  <g font-family="JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none" font-size="12" fill="var(--fig-ink)" text-anchor="middle">
    <text x="147" y="49">embed_tokens</text><text x="287" y="49">layers.0-15</text><text x="457" y="49" fill="var(--fig-muted)">layers.16-31</text><text x="597" y="49">lm_head</text>
    <text x="147" y="79" fill="var(--fig-muted)">embed_tokens</text><text x="287" y="79" fill="var(--fig-muted)">layers.0-15</text><text x="457" y="79">layers.16-31</text><text x="597" y="79" fill="var(--fig-muted)">lm_head</text>
    <text x="147" y="115">iz A</text><text x="287" y="115">iz A</text><text x="457" y="115">iz B</text><text x="597" y="115">iz A</text>
  </g>

  <!-- TIES/DARE -->
  <rect x="1" y="143" width="678" height="182" fill="var(--fig-soft)" stroke="var(--fig-line)" stroke-width="1"/>
  <text x="13" y="164" font-family="Barlow Condensed, Arial Narrow, Arial, sans-serif" font-size="17" font-weight="700" fill="var(--fig-b)">TIES i DARE: spaja se razlika od baze</text>

  <g font-family="Barlow, Arial, sans-serif" font-size="13" font-weight="600" fill="var(--fig-ink)">
    <text x="13" y="186">1. Razlika od baze</text><text x="186" y="186">2. DARE</text><text x="346" y="186">3. TIES</text><text x="510" y="186">4. Natrag u bazu</text>
  </g>
  <g font-family="Barlow, Arial, sans-serif" font-size="12" fill="var(--fig-muted)">
    <text x="13" y="202">τ = model − baza</text>
    <text x="186" y="202">izbaci nasumičan dio,</text><text x="186" y="217">ostatak pojačaj (×2)</text>
    <text x="346" y="202">zadrži većinski predznak,</text><text x="346" y="217">pa uzmi prosjek ostatka</text>
    <text x="510" y="202">baza se ne dira,</text><text x="510" y="217">samo joj se dodaje τ</text>
  </g>

  <!-- ćelije: τ1, τ2, zatim DARE, zatim TIES -->
  <g fill="var(--fig-bg)" stroke="var(--fig-a)" stroke-width="1">
    <path d="M36 228h132v24H36zM58 228v24M80 228v24M102 228v24M124 228v24M146 228v24"/>
    <path d="M36 258h132v24H36zM58 258v24M80 258v24M102 258v24M124 258v24M146 258v24"/>
    <path d="M186 228h132v24H186zM208 228v24M230 228v24M252 228v24M274 228v24M296 228v24"/>
    <path d="M186 258h132v24H186zM208 258v24M230 258v24M252 258v24M274 258v24M296 258v24"/>
  </g>
  <rect x="230" y="258" width="22" height="24" fill="var(--fig-b-soft)" stroke="var(--fig-b)" stroke-width="1.4"/>
  <path d="M346 243h132v24H346zM368 243v24M390 243v24M412 243v24M434 243v24M456 243v24" fill="var(--fig-c-soft)" stroke="var(--fig-c)" stroke-width="1"/>
  <rect x="510" y="243" width="156" height="24" fill="var(--fig-a-soft)" stroke="var(--fig-a)" stroke-width="1.2"/>

  <g fill="none" stroke="var(--fig-muted)" stroke-width="1.2" marker-end="url(#spajanje-str)">
    <path d="M168 255H185"/><path d="M318 255H345"/><path d="M478 255H509"/>
  </g>

  <g font-family="Barlow, Arial, sans-serif" font-size="12.5" fill="var(--fig-ink)" text-anchor="middle">
    <text x="47" y="245">+2</text><text x="69" y="245">−1</text><text x="91" y="245">+3</text><text x="113" y="245">0</text><text x="135" y="245">−2</text><text x="157" y="245">+1</text>
    <text x="47" y="275">+1</text><text x="69" y="275">+2</text><text x="91" y="275">−1</text><text x="113" y="275">+1</text><text x="135" y="275">−2</text><text x="157" y="275">0</text>

    <text x="197" y="245">+4</text><text x="219" y="245" fill="var(--fig-muted)">0</text><text x="241" y="245">+6</text><text x="263" y="245" fill="var(--fig-muted)">0</text><text x="285" y="245">−4</text><text x="307" y="245" fill="var(--fig-muted)">0</text>
    <text x="197" y="275" fill="var(--fig-muted)">0</text><text x="219" y="275">+4</text><text x="241" y="275" fill="var(--fig-b)" font-weight="700">−2</text><text x="263" y="275" fill="var(--fig-muted)">0</text><text x="285" y="275">−4</text><text x="307" y="275" fill="var(--fig-muted)">0</text>

    <text x="357" y="260">+4</text><text x="379" y="260">+4</text><text x="401" y="260">+6</text><text x="423" y="260">0</text><text x="445" y="260">−4</text><text x="467" y="260">0</text>
    <text x="588" y="260" font-weight="600">izlaz = baza + τ</text>
  </g>
  <g font-family="Barlow, Arial, sans-serif" font-size="12.5" font-weight="600" fill="var(--fig-a)">
    <text x="13" y="245">τ1</text><text x="13" y="275">τ2</text>
  </g>
  <text x="13" y="311" font-family="Barlow, Arial, sans-serif" font-size="12.5" fill="var(--fig-muted)">Brojke su ilustracija. U Mergekitu: <tspan font-family="JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none" font-size="12">ties</tspan>, <tspan font-family="JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none" font-size="12">dare_linear</tspan>, <tspan font-family="JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none" font-size="12">dare_ties</tspan>. Narančasta ćelija izgubila je glasanje o predznaku.</text>

  <text x="1" y="347" font-family="Barlow, Arial, sans-serif" font-size="13" font-weight="600" fill="var(--fig-ink)">Uvjet za oba načina: sve dimenzije osim rječnika moraju se poklapati.</text>
  <text x="1" y="362" font-family="Barlow, Arial, sans-serif" font-size="12.5" fill="var(--fig-muted)">Razlika od baze ima smisla samo za modele podešene iz iste baze.</text>
</svg>
