<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 396" role="img" aria-label="Sloj MoE: usmjerivač za svaki token bira K stručnjaka, a svi ostaju u memoriji. Računski primjer Llama 3 8B puta tri ima oko 19,3 milijarde parametara ukupno i 8,03 milijarde aktivnih.">
  <defs><marker id="moe-str" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 .8 7.5 4 0 7.2z" fill="var(--fig-muted)"/></marker>
  <marker id="moe-nar" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 .8 7.5 4 0 7.2z" fill="var(--fig-b)"/></marker></defs>

  <!-- tok -->
  <rect x="1" y="80" width="112" height="52" fill="var(--fig-a-soft)" stroke="var(--fig-a)" stroke-width="1.2"/>
  <rect x="139" y="72" width="104" height="68" fill="var(--fig-c-soft)" stroke="var(--fig-c)" stroke-width="1.4"/>
  <path d="M113 106H138" fill="none" stroke="var(--fig-muted)" stroke-width="1.2" marker-end="url(#moe-str)"/>

  <!-- okvir: sve u memoriji -->
  <rect x="284" y="4" width="146" height="204" fill="var(--fig-soft)" stroke="var(--fig-line)" stroke-width="1" stroke-dasharray="4 3"/>

  <g fill="none" stroke="var(--fig-line)" stroke-width="1" stroke-dasharray="3 3">
    <path d="M243 106 291 22M243 106 291 46M243 106 291 94M243 106 291 142M243 106 291 190"/>
  </g>
  <g fill="none" stroke="var(--fig-b)" stroke-width="1.5" marker-end="url(#moe-nar)">
    <path d="M243 106 290 70"/><path d="M243 106 290 118"/>
    <path d="M423 70 469 104"/><path d="M423 118 469 108"/>
  </g>

  <!-- stručnjaci -->
  <g fill="var(--fig-bg)" stroke="var(--fig-line)" stroke-width="1">
    <rect x="291" y="12" width="132" height="20"/><rect x="291" y="36" width="132" height="20"/><rect x="291" y="84" width="132" height="20"/><rect x="291" y="132" width="132" height="20"/><rect x="291" y="156" width="132" height="20"/><rect x="291" y="180" width="132" height="20"/>
  </g>
  <g fill="var(--fig-b-soft)" stroke="var(--fig-b)" stroke-width="1.4">
    <rect x="291" y="60" width="132" height="20"/><rect x="291" y="108" width="132" height="20"/>
  </g>
  <g font-family="Barlow, Arial, sans-serif" font-size="12" fill="var(--fig-muted)" text-anchor="middle">
    <text x="357" y="26">stručnjak 1</text><text x="357" y="50">stručnjak 2</text>
    <text x="357" y="74" fill="var(--fig-ink)" font-weight="600">stručnjak 3: računa</text>
    <text x="357" y="98">stručnjak 4</text>
    <text x="357" y="122" fill="var(--fig-ink)" font-weight="600">stručnjak 5: računa</text>
    <text x="357" y="146">stručnjak 6</text><text x="357" y="170">stručnjak 7</text><text x="357" y="194">stručnjak 8</text>
  </g>

  <rect x="470" y="80" width="94" height="52" fill="var(--fig-a-soft)" stroke="var(--fig-a)" stroke-width="1.2"/>
  <rect x="590" y="80" width="89" height="52" fill="var(--fig-soft)" stroke="var(--fig-line)" stroke-width="1.2"/>
  <path d="M564 106H589" fill="none" stroke="var(--fig-muted)" stroke-width="1.2" marker-end="url(#moe-str)"/>

  <g font-family="Barlow, Arial, sans-serif" font-size="13" fill="var(--fig-ink)" text-anchor="middle">
    <text x="57" y="102" font-weight="600">Pažnja</text>
    <text x="57" y="119" font-size="12" fill="var(--fig-muted)">zajednička svima</text>
    <text x="191" y="92" font-weight="600">Usmjerivač</text>
    <text x="191" y="128" font-size="12">Top-K, K = 2</text>
    <text x="517" y="102" font-weight="600">Zbroj</text>
    <text x="517" y="119" font-size="12" fill="var(--fig-muted)">s težinama</text>
    <text x="634" y="102">sljedeći</text><text x="634" y="118">sloj</text>
    <text x="357" y="226" font-size="12.5">Svih 8 stručnjaka ostaje u memoriji; za ovaj token računaju samo 2.</text>
    <text x="357" y="242" font-size="12.5" fill="var(--fig-muted)">Usmjerivač bira za svaki token iznova.</text>
  </g>
  <text x="191" y="110" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none" font-size="12" fill="var(--fig-ink)">gate</text>

  <!-- računica, u mjerilu: 28 jedinica = 1 milijarda -->
  <text x="1" y="276" font-family="Barlow Condensed, Arial Narrow, Arial, sans-serif" font-size="16" font-weight="700" fill="var(--fig-ink)">Računski primjer, u mjerilu: Llama 3 8B × 3, K = 1</text>
  <text x="650.6" y="276" text-anchor="end" font-family="Barlow, Arial, sans-serif" font-size="13" font-weight="600" fill="var(--fig-ink)">ukupno oko 19,3 milijarde</text>

  <rect x="110" y="284" width="66.9" height="26" fill="var(--fig-a-soft)" stroke="var(--fig-a)" stroke-width="1"/>
  <rect x="176.9" y="284" width="157.9" height="26" fill="var(--fig-b-soft)" stroke="var(--fig-b)" stroke-width="1"/>
  <rect x="334.8" y="284" width="157.9" height="26" fill="var(--fig-b-soft)" stroke="var(--fig-b)" stroke-width="1"/>
  <rect x="492.7" y="284" width="157.9" height="26" fill="var(--fig-b-soft)" stroke="var(--fig-b)" stroke-width="1"/>
  <rect x="110" y="318" width="66.9" height="26" fill="var(--fig-a-soft)" stroke="var(--fig-a)" stroke-width="1"/>
  <rect x="176.9" y="318" width="157.9" height="26" fill="var(--fig-b-soft)" stroke="var(--fig-b)" stroke-width="1"/>

  <g font-family="Barlow, Arial, sans-serif" font-size="12.5" fill="var(--fig-ink)">
    <text x="1" y="302" font-weight="600">U memoriji</text>
    <text x="1" y="336" font-weight="600">Računa za token</text>
    <g text-anchor="middle">
      <text x="143.4" y="302">2,39</text><text x="255.8" y="302">5,64</text><text x="413.8" y="302">5,64</text><text x="571.7" y="302">5,64</text>
      <text x="143.4" y="336">2,39</text><text x="255.8" y="336">5,64</text>
    </g>
    <text x="344" y="336" font-weight="600">8,03 milijarde aktivnih</text>
  </g>
  <g font-family="Barlow, Arial, sans-serif" font-size="12.5" fill="var(--fig-muted)">
    <text x="1" y="365">2,39: embedding, glava i pažnja, zajednički dio. 5,64: MLP, jedan stručnjak. Sve u milijardama parametara.</text>
    <text x="1" y="385">Stvarni model: Kimi K3, 2,8 bilijuna parametara ukupno, 104 milijarde aktivnih (sekundarni izvor).</text>
  </g>
</svg>
